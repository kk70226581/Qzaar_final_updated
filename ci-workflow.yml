name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-verification:
    name: Backend Lint & Syntax Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: streetqr/backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: streetqr/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Node.js Syntax
        run: node --check index.js models.js routes-orders.js routes-inventory.js routes-analytics.js routes-payments.js routes-auth.js middleware/auth.js

      - name: Run Backend Integration & Unit Tests
        run: npm test

  frontend-verification:
    name: Frontend Test & Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: streetqr
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: streetqr/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Frontend Tests
        run: npm test -- --watchAll=false --passWithNoTests
        env:
          CI: true

      - name: Build Production Bundle
        run: npm run build
        env:
          CI: false
