<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- Favicons: Make sure these files are in public/ -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="%PUBLIC_URL%/favicon-96x96.png" />
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/site.webmanifest" />

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- SEO Meta Tags -->
    <title>Mini website for each Shop</title>
    <meta name="description" content="Qzaar is a modern QR-based digital ordering system for restaurants, cafes, and hotels. Scan. Order. Enjoy." />
    <meta name="theme-color" content="#2d89ef" />

    <!-- Open Graph for Social Sharing -->
    <meta property="og:title" content="Qzaar - QR Code Ordering" />
    <meta property="og:description" content="Scan QR, view menu, place order — all digitally with Qzaar." />
    <meta property="og:image" content="%PUBLIC_URL%/logo512.png" />
    <meta property="og:url" content="https://www.qzaar.shop" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Qzaar - QR Code Ordering Platform" />
    <meta name="twitter:description" content="QR-based ordering for restaurants, cafes, and hotels." />
    <meta name="twitter:image" content="%PUBLIC_URL%/logo512.png" />
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
